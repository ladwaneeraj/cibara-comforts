name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Only one deployment at a time. `cancel-in-progress: false` so a queued
# deploy is not thrown away by a rapid second push.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Image derivatives are NOT regenerated here. They live in public/media
      # and are committed, and the .stamp files that make regeneration
      # incremental are gitignored, so running the pipeline in CI would
      # rebuild all sixteen images from scratch on every deploy: about two
      # minutes, for output that should be byte-identical to what is already
      # in the repository.
      #
      # The contract is therefore: whoever adds or changes a photograph runs
      # `npm run images` locally and commits the result. This step only checks
      # that they did.
      - name: Check image derivatives are committed
        run: |
          test -f src/content/generated/media.ts || {
            echo "::error::src/content/generated/media.ts is missing. Run 'npm run images' locally and commit the result."
            exit 1
          }
          test -d public/media || {
            echo "::error::public/media is missing. Run 'npm run images' locally and commit the result."
            exit 1
          }

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs `npm run content` first, which regenerates public/llms.txt from
      # the content files, then the static export into out/.
      - name: Build
        run: npm run build
        # Every NEXT_PUBLIC_* value is inlined into the client bundle at build
        # time and is readable in page source, so these are repository
        # *variables*, not secrets. Set them under
        # Settings > Secrets and variables > Actions > Variables.
        # A variable that is unset simply disables that tag; see lib/analytics.ts.
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL }}
          NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_NTFY_TOPIC: ${{ vars.NEXT_PUBLIC_NTFY_TOPIC }}
          # ERP base URL for online booking. Unset means the widget shows
          # "Online booking paused" and the WhatsApp enquiry instead.
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}

      - name: Verify the export
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL }}
        run: |
          test -f out/index.html
          test -f out/CNAME
          test -f out/.nojekyll
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/llms.txt

          # Conversion tracking is checked here rather than trusted, because
          # the failure mode is silent: an unset repository variable ships a
          # site that looks fine and reports nothing, while the campaign keeps
          # spending. A red build is the cheaper way to find out.
          for var in NEXT_PUBLIC_GOOGLE_ADS_ID NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set. Add it under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
          # The id and label are inlined as two separate string literals and
          # only joined at runtime, so grep for each one rather than the
          # concatenated send_to value.
          for value in "$NEXT_PUBLIC_GOOGLE_ADS_ID" "$NEXT_PUBLIC_GOOGLE_ADS_LEAD_LABEL"; do
            grep -rqF "$value" out/ || {
              echo "::error::'$value' is missing from the export; conversion tracking would not ship."
              exit 1
            }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
