name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Only one deployment at a time. `cancel-in-progress: false` so a queued
# deploy is not thrown away by a rapid second push.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The generated derivatives live in public/media, which is committed, so
      # this is normally a no-op. It re-runs only when a source photograph in
      # assets/source has changed, and the .stamp files make it incremental.
      - name: Optimise images
        run: npm run images

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs `npm run content` first, which regenerates public/llms.txt from
      # the content files, then the static export into out/.
      - name: Build
        run: npm run build

      - name: Verify the export
        run: |
          test -f out/index.html
          test -f out/CNAME
          test -f out/.nojekyll
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/llms.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
